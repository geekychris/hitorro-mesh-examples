server:
  port: 8091
spring:
  main:
    banner-mode: off
hitorro:
  mesh:
    agent:
      id: agent-eu
      transport: nats
      nats-url: nats://nats:4222
      heartbeat-interval: 500ms
      capabilities: [jvssql, partition:docs:eu]
      tables:
        - name: docs
          partition-key: eu
          type-json-resource: file:/data/types/docs.json
          ndjson-file: file:/data/data/eu.ndjson
